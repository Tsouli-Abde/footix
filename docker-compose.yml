services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: footix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-footix}
      POSTGRES_DB: footix
      TZ: Europe/Paris
    volumes:
      - footix-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U footix']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://footix:${POSTGRES_PASSWORD:-footix}@db:5432/footix?schema=public
      TZ: Europe/Paris
      # Notifications push : renseigner ces variables (via un .env à la racine ou
      # des secrets) active le push. Vides, les notifications sont désactivées.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:footix@example.com}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      # 8080 est souvent pris par un autre service local, on expose sur 8090.
      - '8090:80'
    depends_on:
      - backend
    restart: unless-stopped

  # Génération des événements hebdomadaires. Le job est idempotent : le
  # relancer ne crée jamais de doublon, une passe par jour suffit largement.
  cron:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://footix:${POSTGRES_PASSWORD:-footix}@db:5432/footix?schema=public
      TZ: Europe/Paris
      # Le job envoie la notification "sondage ouvert", il lui faut donc les mêmes clés.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:footix@example.com}
    command: sh -c 'while true; do node dist/jobs/generate-recurring.js; sleep 86400; done'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  footix-data:
