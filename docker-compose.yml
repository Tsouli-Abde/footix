# Nom de projet fixé : les conteneurs, volumes et le réseau gardent le préfixe
# "footix" quel que soit le nom du dossier où le repo est cloné. Important dès
# qu'on partage une machine avec d'autres projets Docker Compose.
name: footix

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: footix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-footix}
      POSTGRES_DB: footix
      TZ: Europe/Paris
    ports:
      # Publié pour que `npm run dev` et les tests, lancés sur la machine,
      # puissent y accéder. Port atypique choisi exprès : le 5432 habituel reste
      # libre pour un PostgreSQL déjà installé, et rien ne vient en conflit.
      - '29433:5432'
    volumes:
      - footix-data:/var/lib/postgresql/data
      # Crée la base de test au premier démarrage du volume (voir npm test).
      - ./deploy/dev-init-db.sql:/docker-entrypoint-initdb.d/dev-init-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U footix']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://footix:${POSTGRES_PASSWORD:-footix}@db:5432/footix?schema=public
      TZ: Europe/Paris
      # Notifications push : renseigner ces variables (via un .env à la racine ou
      # des secrets) active le push. Vides, les notifications sont désactivées.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:footix@example.com}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      # Seul port de l'app publié sur la machine. Volontairement loin des 8080,
      # 8090 et autres, souvent déjà pris par un autre projet.
      - '29090:80'
    depends_on:
      - backend
    restart: unless-stopped

  # Battement horaire : récapitulatif de la veille et clôture automatique des
  # sondages oubliés. Idempotent, le relancer ne double rien.
  cron:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://footix:${POSTGRES_PASSWORD:-footix}@db:5432/footix?schema=public
      TZ: Europe/Paris
      # Le job envoie la notification "sondage ouvert", il lui faut donc les mêmes clés.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:footix@example.com}
    command: >
      sh -c 'while true; do node dist/jobs/tick.js; sleep 3600; done'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  footix-data:
