  <g stroke="#4ade80" stroke-width="2" fill="none" stroke-linejoin="round">
    <rect x="16" y="17.5" width="32" height="29" rx="2.5" />
    <path d="M16 32h32" />
    <circle cx="32" cy="32" r="5.6" />
    <path d="M16 25.6h4.8v12.8h-4.8M48 25.6h-4.8v12.8h4.8" />
  </g>
