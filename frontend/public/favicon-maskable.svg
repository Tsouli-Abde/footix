<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="nuit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b" />
      <stop offset="1" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Version maskable : Android peut rogner jusqu'a un cercle de 80%. Le fond
       couvre donc tout le carre et le terrain est reduit pour rester dans la
       zone sure, coins compris. -->
