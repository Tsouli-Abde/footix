server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # L'API est servie sous la même origine : pas de CORS à gérer en production.
  location /api/ {
    proxy_pass http://backend:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Les assets sont hachés par Vite : cache long sans risque de version périmée.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Le service worker doit être revalidé à chaque chargement, sinon l'app
  # reste bloquée sur une ancienne version.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  # Application monopage : toutes les routes retombent sur index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
